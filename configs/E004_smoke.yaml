# Mac smoke test for the E004 changes (EMA + PQ-based checkpoint selection):
# 50 iterations on MPS, train -> resume (with EMA state) -> infer -> evaluate
# on a tiny PQ-validation subset, before anything goes to Kaggle
# (CODING_SPEC_03_FP_AND_FOLDS.md).
experiment_id: E004_smoke
description: tiny smoke-test config for EMA + instance-PQ checkpoint selection, not a real experiment
seed: 42
fold: 0
device: auto
encoder_name: resnet34
crop_size: 512
batch_size: 2
dataset_length: 20
total_iterations: 50
warmup_steps: 5
lr: 0.0003
weight_decay: 0.0001
checkpoint_every: 25
log_every: 10
amp: false
ema_decay: 0.999
checkpoint_select_by: pq
n_pq_val_images: 2
num_workers: 0
cache_workers: 1
prebuild_cache: false
save_oof_and_test_probs: false
infer_tile_size: 512
infer_overlap: 64
checkpoint_postprocess:
  mode: threshold
  t: 0.7
  closing_radius: 2
  min_area: 418
